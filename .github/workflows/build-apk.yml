name: Build Loopr APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > smartautoclicker/smartautoclicker.jks

      - name: Make Gradlew executable
        run: chmod +x gradlew

      - name: Build fDroid Release APK
        run: |
          ./gradlew assembleFDroidRelease \
            -PsigningStorePassword="${{ secrets.SIGNING_STORE_PASSWORD }}" \
            -PsigningKeyAlias="${{ secrets.SIGNING_KEY_ALIAS }}" \
            -PsigningKeyPassword="${{ secrets.SIGNING_KEY_PASSWORD }}"
        env:
          JAVA_TOOL_OPTIONS: "-Djava.net.preferIPv4Stack=true"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: Loopr-Release-APKs
          path: smartautoclicker/build/outputs/apk/fDroid/release/*.apk
